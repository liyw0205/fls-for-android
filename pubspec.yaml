name: fls_for_android
description: "FLS Android client and private local panel runtime."
publish_to: 'none'
version: 0.1.17+18

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  crypto: ^3.0.7
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  markdown: ^7.3.1
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/fls_panel_icon.png
